  <script src="ao-nav.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      background-image:
        radial-gradient(900px 700px at 50% -5%, rgba(var(--amber), 0.10), transparent 60%),
        linear-gradient(180deg, var(--bg2), var(--bg));
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }

    .tour-wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 28px 120px;
    }

    /* ── Chooser (entry screen) ─────────────────────────────────── */
    .chooser-hero {
      text-align: center;
      padding: 32px 0 48px;
    }
    .chooser-hero h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 18px;
    }
    .chooser-hero .sub {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      max-width: 58ch;
      margin: 0 auto;
    }
    .paths-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    @media (max-width: 820px) {
      .paths-grid { grid-template-columns: 1fr; }
    }
    .path-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 26px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      box-shadow: var(--shadow-soft);
    }
    .path-card:hover {
      transform: translateY(-2px);
      border-color: rgba(var(--amber), 0.35);
      box-shadow: 0 10px 32px -12px rgba(var(--amber), 0.25), var(--shadow-soft);
    }
    .path-card .chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgb(var(--amber));
      background: rgba(var(--amber), 0.12);
      border: 1px solid rgba(var(--amber), 0.28);
      padding: 4px 10px;
      border-radius: 999px;
      align-self: flex-start;
    }
    .path-card h3 {
      font-size: 22px;
      font-weight: 600;
      margin: 4px 0 0;
      letter-spacing: -0.01em;
    }
    .path-card .who {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }
    .path-card .takeaway {
      font-size: 13px;
      color: var(--faint);
      margin: 0;
      line-height: 1.5;
      padding-top: 12px;
      border-top: 1px solid var(--hairline);
    }
    .path-card .time {
      font-size: 11px;
      color: var(--faint);
      font-family: var(--mono);
      margin-top: auto;
    }

    /* ── Step view ──────────────────────────────────────────────── */
    .tour-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0 24px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 32px;
    }
    .tour-bar .path-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }
    .tour-bar .step-count {
      font-size: 12px;
      color: var(--faint);
      font-family: var(--mono);
      margin-left: auto;
    }
    .tour-bar .exit {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border2);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      transition: color 120ms ease, border-color 120ms ease;
    }
    .tour-bar .exit:hover { color: var(--text); border-color: var(--border3); }

    .progress {
      position: relative;
      height: 4px;
      background: var(--panel);
      border-radius: 999px;
      margin-bottom: 36px;
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, rgba(var(--amber), 0.7), rgba(var(--amber), 1));
      transition: width 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .step {
      animation: fadeUp 260ms ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .step h2 {
      font-size: clamp(28px, 3.4vw, 38px);
      font-weight: 600;
      letter-spacing: -0.015em;
      margin: 0 0 14px;
      line-height: 1.15;
    }
    .step .intro {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
      margin: 0 0 28px;
      max-width: 62ch;
    }
    .step .intro strong { color: var(--text); font-weight: 600; }

    .visual {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin: 0 0 24px;
      box-shadow: var(--shadow-soft);
    }
    .visual.flush { padding: 0; overflow: hidden; }
    .visual h4 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 14px;
    }

    /* Mock screen frame (for product screenshots / stylized previews) */
    .mock {
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .mock-chrome {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border2);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
    }
    .mock-chrome .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
    }
    .mock-chrome .url {
      margin-left: 12px;
      padding: 2px 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
    }
    .mock-body { padding: 20px 22px; }

    /* Agent roster visual */
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 720px) { .agent-grid { grid-template-columns: repeat(2, 1fr); } }
    .agent-cell {
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }
    .agent-cell .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }
    .agent-cell .role {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Queue / pipeline visual */
    .pipeline {
      display: grid;
      gap: 8px;
    }
    .pipe-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      font-size: 13px;
    }
    .pipe-row .num {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
      width: 22px;
    }
    .pipe-row .stage { flex: 1; color: var(--text); }
    .pipe-row .agent {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .pipe-row .status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .pipe-row .status.done { background: rgba(var(--green, 74, 222, 128), 0.14); color: rgb(var(--green, 74, 222, 128)); }
    .pipe-row .status.run  { background: rgba(var(--amber), 0.14);  color: rgb(var(--amber)); }
    .pipe-row .status.wait { background: rgba(255,255,255,0.06); color: var(--muted); }

    /* Plan comparison mini-card */
    .tier-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 720px) { .tier-row { grid-template-columns: 1fr; } }
    .tier-cell {
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .tier-cell.featured { border-color: rgba(var(--amber), 0.45); background: rgba(var(--amber), 0.05); }
    .tier-cell .t-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .tier-cell .t-price {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .tier-cell .t-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.45;
    }

    /* Flow diagram (signup → checkout → webhook) */
    .flow {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 12px;
    }
    .flow .node {
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 6px;
      color: var(--text);
      white-space: nowrap;
    }
    .flow .node.accent {
      border-color: rgba(var(--amber), 0.45);
      background: rgba(var(--amber), 0.08);
      color: rgb(var(--amber));
    }
    .flow .arrow {
      color: var(--faint);
      font-family: var(--mono);
    }

    /* Callout for speaker notes / reference tips */
    .callout {
      background: var(--panel);
      border-left: 3px solid rgba(var(--amber), 0.6);
      border-radius: 4px;
      padding: 12px 16px;
      margin: 20px 0 0;
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
    }
    .callout strong { color: var(--text); }
    .callout code {
      font-family: var(--mono);
      font-size: 12px;
      color: rgb(var(--amber));
      background: var(--panel2);
      padding: 1px 6px;
      border-radius: 3px;
    }

    /* Nav buttons */
    .tour-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--hairline);
    }
    .btn {
      appearance: none;
      border: 0;
      padding: 11px 18px;
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 120ms ease, transform 120ms ease, background 120ms ease, border-color 120ms ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: rgba(var(--amber), 0.92);
      color: #1a1200;
      font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary[disabled] { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border2);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--border3); }
    .btn-ghost[disabled] { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .btn-accent {
      background: transparent;
      border: 1px solid rgba(var(--amber), 0.4);
      color: rgb(var(--amber));
    }
    .btn-accent:hover { background: rgba(var(--amber), 0.08); border-color: rgba(var(--amber), 0.6); }

    .tour-nav .spacer { flex: 1; }

    .share-pill {
      font-size: 11px;
      color: var(--faint);
      font-family: var(--mono);
      background: var(--panel);
      border: 1px solid var(--border2);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: color 120ms ease;
    }
    .share-pill:hover { color: var(--text); }
    .share-pill.copied { color: rgb(var(--amber)); }

    .hidden { display: none !important; }

    /* Key-cap hint */
    kbd {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--panel2);
      border: 1px solid var(--border2);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--muted);
    }

    .kbd-hint {
      position: fixed;
      bottom: 22px;
      right: 24px;
      font-size: 11px;
      color: var(--faint);
      background: var(--panel);
      border: 1px solid var(--border2);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      display: flex;
      gap: 8px;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    @media (max-width: 720px) { .kbd-hint { display: none; } }
  </style>
</head>
<body>

  <main class="tour-wrap">

    <!-- ── CHOOSER (entry screen) ──────────────────────────────── -->
    <section id="chooser" class="hidden">
      <div class="chooser-hero">
        <h1>Take a tour of AO.</h1>
        <p class="sub">
          AO is a seven-agent virtual agency that runs on your brief. Pick the path
          that matches where you are — each one is a short, linear walkthrough.
        </p>
      </div>

      <div class="paths-grid" id="paths-grid">
        <!-- Filled by JS from TOURS data -->
      </div>
    </section>

    <!-- ── STEP VIEW ───────────────────────────────────────────── -->
    <section id="step-view" class="hidden">
      <div class="tour-bar">
        <span class="path-label" id="bar-label">Tour</span>
        <span class="step-count" id="bar-count">1 / 1</span>
        <span class="spacer" style="flex:1"></span>
        <span class="share-pill" id="share-btn" title="Copy shareable link">share step</span>
        <a class="exit" id="exit-btn" href="/ao/tour.html">switch path</a>
      </div>

      <div class="progress"><span id="progress-fill" style="width:0%"></span></div>

      <article class="step" id="step-container">
        <!-- Rendered from TOURS[path][step] -->
      </article>

      <nav class="tour-nav">
        <button class="btn btn-ghost" id="prev-btn" type="button">← Prev</button>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="next-btn" type="button">Next →</button>
      </nav>
    </section>

  </main>

  <div class="kbd-hint">
    <kbd>←</kbd><kbd>→</kbd>
    <span>navigate · </span>
    <kbd>Esc</kbd>
    <span>exit</span>
  </div>

  <script>
    (function(){
      'use strict';

      // ── Data ────────────────────────────────────────────────────
      // Each path is an array of steps. Each step has { title, intro, visual }.
      // `visual` is inline HTML rendered inside the step container — kept
      // declarative so content can be edited without touching the renderer.

      var TOURS = {
        curious: {
          meta: {
            label: 'Curious',
            chip: 'First look',
            title: 'I\'m just looking',
            who: 'You\'ve heard of AO and want to know what it actually is.',
            takeaway: 'You\'ll leave knowing if this is worth trying.',
            time: '~4 min · 7 steps'
          },
          steps: [
            {
              title: 'The problem: a small team can\'t afford a real agency.',
              intro: 'Running marketing, dev, UXR, QA, biz dev, and customer service takes a team of five to ten people — $400K–$1M a year in Portland. For a founder, a designer-of-one, a two-person studio — that\'s not happening. So work slips. Work slips long enough and the business stalls.',
              visual:
                '<div class="visual"><h4>What usually happens</h4>' +
                '<div class="pipeline">' +
                '<div class="pipe-row"><span class="num">01</span><span class="stage">Landing page copy that never gets rewritten</span><span class="status wait">waiting</span></div>' +
                '<div class="pipe-row"><span class="num">02</span><span class="stage">Competitor scan that should happen every week</span><span class="status wait">waiting</span></div>' +
                '<div class="pipe-row"><span class="num">03</span><span class="stage">Accessibility audit before the next launch</span><span class="status wait">waiting</span></div>' +
                '<div class="pipe-row"><span class="num">04</span><span class="stage">Answering last Tuesday\'s support email</span><span class="status wait">waiting</span></div>' +
                '</div></div>'
            },
            {
              title: 'The idea: a virtual agency that actually runs.',
              intro: 'AO is seven specialist AI agents — plus an executive assistant — that work like a real team. They write briefs to each other, escalate blockers, hand off deliverables, and track what\'s in progress. You get the output without hiring anyone.',
              visual:
                '<div class="visual"><h4>The roster</h4><div class="agent-grid">' +
                '<div class="agent-cell"><div class="name">Marketing Lead</div><div class="role">Competitive scans, positioning, launch prep</div></div>' +
                '<div class="agent-cell"><div class="name">Dev Lead</div><div class="role">Feature implementation, deploys</div></div>' +
                '<div class="agent-cell"><div class="name">UX Research</div><div class="role">Heuristic evals, accessibility audits</div></div>' +
                '<div class="agent-cell"><div class="name">Biz Dev</div><div class="role">Distribution, pricing, partnerships</div></div>' +
                '<div class="agent-cell"><div class="name">Customer Service</div><div class="role">Inbox triage, feedback synthesis</div></div>' +
                '<div class="agent-cell"><div class="name">QA / Brand</div><div class="role">Visual regression, brand consistency</div></div>' +
                '<div class="agent-cell"><div class="name">Exec Assistant</div><div class="role">Unblocks agents, routes decisions</div></div>' +
                '<div class="agent-cell" style="border-color:rgba(var(--amber),0.45);background:rgba(var(--amber),0.06)"><div class="name" style="color:rgb(var(--amber))">You (CEO)</div><div class="role">Set direction · veto · ship</div></div>' +
                '</div></div>'
            },
            {
              title: 'How they coordinate: briefs, handoffs, queue.',
              intro: 'Agents don\'t just prompt each other. They write structured briefs to <strong>/briefs/</strong>, hand off work through <strong>/handoffs/</strong>, and track multi-stage tasks in a <strong>/queue/</strong>. The Executive Assistant watches everything, unblocks what it can, and escalates only what you need to decide.',
              visual:
                '<div class="visual"><h4>A task moving through the agency</h4>' +
                '<div class="pipeline">' +
                '<div class="pipe-row"><span class="num">1</span><span class="stage">Marketing writes competitive scan</span><span class="agent">Marketing</span><span class="status done">done</span></div>' +
                '<div class="pipe-row"><span class="num">2</span><span class="stage">UXR reviews, scores severity</span><span class="agent">UXR</span><span class="status done">done</span></div>' +
                '<div class="pipe-row"><span class="num">3</span><span class="stage">Dev implements pricing tweak</span><span class="agent">Dev</span><span class="status run">running</span></div>' +
                '<div class="pipe-row"><span class="num">4</span><span class="stage">QA validates before ship</span><span class="agent">QA</span><span class="status wait">waiting</span></div>' +
                '<div class="pipe-row"><span class="num">5</span><span class="stage">EA synthesizes, reports to you</span><span class="agent">EA</span><span class="status wait">waiting</span></div>' +
                '</div></div>'
            },
            {
              title: 'Your role: set direction, approve, ship.',
              intro: 'You\'re CEO. You brief, you veto, you decide on pricing / brand / external commitments. Everything else runs without you. The EA generates a morning summary so you see only what needs your attention — usually zero to three decisions a day.',
              visual:
                '<div class="visual"><h4>A typical morning</h4>' +
                '<div class="pipeline">' +
                '<div class="pipe-row"><span class="num">☕</span><span class="stage">Open your morning email</span><span class="agent">7:02 AM</span><span class="status done">arrived</span></div>' +
                '<div class="pipe-row"><span class="num">📬</span><span class="stage">3 decisions to approve · 1 launch ready · 2 briefs drafted</span><span class="agent">EA digest</span><span class="status run">open</span></div>' +
                '<div class="pipe-row"><span class="num">✓</span><span class="stage">Click, approve, add a note, close laptop</span><span class="agent">You</span><span class="status wait">done in 8 min</span></div>' +
                '</div></div>'
            },
            {
              title: 'What it looks like.',
              intro: 'You don\'t talk to a chatbot. You watch your agency work. The dashboard shows live agent runs, the queue shows pipelines in progress, and the report shows what shipped since yesterday.',
              visual:
                '<div class="visual flush">' +
                '<div class="mock"><div class="mock-chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">deliberateux.com/ao/dashboard.html</span></div>' +
                '<div class="mock-body">' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
                '<div class="pipe-row"><span class="num">MA</span><span class="stage">Marketing · competitive scan</span><span class="status run">running</span></div>' +

                '<div class="pipe-row"><span class="num">/</span><span class="stage">index.html — marketing landing</span><span class="agent">public</span><span class="status done">✓</span></div>' +
                '<div class="pipe-row"><span class="num">/</span><span class="stage">pricing.html — tiers + signed-in checkout</span><span class="agent">public</span><span class="status done">✓</span></div>' +
                '<div class="pipe-row"><span class="num">/</span><span class="stage">account.html — sign-in + console + billing</span><span class="agent">both</span><span class="status done">✓</span></div>' +
                '<div class="pipe-row"><span class="num">/</span><span class="stage">onboard.html — org setup wizard</span><span class="agent">auth</span><span class="status done">✓</span></div>' +
                '<div class="pipe-row"><span class="num">/</span><span class="stage">configure.html — per-org config</span><span class="agent">auth</span><span class="status done">✓</span></div>' +
                '<div class="pipe-row"><span class="num">/</span><span class="stage">flows.html / queue.html / dashboard.html</span><span class="agent">auth</span><span class="status done">✓</span></div>' +
                '<div class="pipe-row"><span class="num">/</span><span class="stage">tour.html — this file</span><span class="agent">public</span><span class="status run">running</span></div>' +
                '</div></div>'
            },
            {
              title: 'Wiring order (what\'s left).',
              intro: 'Backend scaffolding is locked. To go from static demo to live SaaS, the remaining path is ordered — each step unblocks the next.',
              visual:
                '<div class="visual"><div class="pipeline">' +
                '<div class="pipe-row"><span class="num">1</span><span class="stage">Create Supabase project, run <code>schema.sql</code>, capture URL + service key</span><span class="status wait">todo</span></div>' +
                '<div class="pipe-row"><span class="num">2</span><span class="stage">Create Clerk app, enable Stripe billing integration, define <code>plan</code> + <code>is_admin</code> metadata keys</span><span class="status wait">todo</span></div>' +
                '<div class="pipe-row"><span class="num">3</span><span class="stage">Load Clerk SDK on every AO page (before ao-user.js)</span><span class="status wait">todo</span></div>' +
                '<div class="pipe-row"><span class="num">4</span><span class="stage"><code>wrangler deploy</code> the worker, route <code>/ao/*</code> through it</span><span class="status wait">todo</span></div>' +
                '<div class="pipe-row"><span class="num">5</span><span class="stage">Create Stripe products + set <code>lookup_key</code>s to <code>ao_pro_monthly</code>, etc.</span><span class="status wait">todo</span></div>' +
                '<div class="pipe-row"><span class="num">6</span><span class="stage">Agent-run proxy to Jack\'s Mac (compute ceiling is the real constraint)</span><span class="status wait">later</span></div>' +
                '</div>' +
                '<div class="callout">Reference: <code>ao/backend/README.md</code> → "Wiring order."</div>' +
                '</div>'
            }
          ]
        }
      };

      // ── Router ──────────────────────────────────────────────────
      var QS = new URLSearchParams(location.search);
      var PATH = QS.get('path');
      var STEP = parseInt(QS.get('step'), 10);
      if (isNaN(STEP)) STEP = 0;

      var $ = function(id){ return document.getElementById(id); };

      function renderChooser() {
        $('step-view').classList.add('hidden');
        $('chooser').classList.remove('hidden');
        var grid = $('paths-grid');
        grid.innerHTML = '';
        Object.keys(TOURS).forEach(function(key){
          var t = TOURS[key];
          var card = document.createElement('a');
          card.className = 'path-card';
          card.href = '?path=' + key + '&step=0';
          card.addEventListener('click', function(ev){
            ev.preventDefault();
            gtag('event', 'tour_path_start', { path: key });
            go(key, 0);
          });
          card.innerHTML =
            '<span class="chip">' + escapeHtml(t.meta.chip) + '</span>' +
            '<h3>' + escapeHtml(t.meta.title) + '</h3>' +
            '<p class="who">' + escapeHtml(t.meta.who) + '</p>' +
            '<p class="takeaway">' + escapeHtml(t.meta.takeaway) + '</p>' +
            '<span class="time">' + escapeHtml(t.meta.time) + '</span>';
          grid.appendChild(card);
        });
      }

      function renderStep(pathKey, stepIdx) {
        var tour = TOURS[pathKey];
        if (!tour) { renderChooser(); return; }
        var steps = tour.steps;
        if (stepIdx < 0) stepIdx = 0;
        if (stepIdx >= steps.length) stepIdx = steps.length - 1;
        var step = steps[stepIdx];

        $('chooser').classList.add('hidden');
        $('step-view').classList.remove('hidden');

        $('bar-label').textContent = tour.meta.label;
        $('bar-count').textContent = (stepIdx + 1) + ' / ' + steps.length;
        $('progress-fill').style.width = ((stepIdx + 1) / steps.length * 100) + '%';

        $('step-container').innerHTML =
          '<h2>' + step.title + '</h2>' +
          '<p class="intro">' + step.intro + '</p>' +
          (step.visual || '');

        $('prev-btn').disabled = stepIdx === 0;
        var nextBtn = $('next-btn');
        if (stepIdx === steps.length - 1) {
          nextBtn.textContent = 'Finish ✓';
        } else {
          nextBtn.textContent = 'Next →';
        }

        // Wire any data-jump="path/step" anchors inside step content.
        $('step-container').querySelectorAll('[data-jump]').forEach(function(el){
          el.addEventListener('click', function(ev){
            ev.preventDefault();
            var parts = el.getAttribute('data-jump').split('/');
            go(parts[0], parseInt(parts[1], 10) || 0);
          });
        });

        // GA: track per-step for tour engagement depth.
        gtag('event', 'tour_step_view', {
          path: pathKey,
          step: stepIdx,
          step_title: step.title.replace(/<[^>]+>/g, '').slice(0, 80)
        });
      }

      function go(pathKey, stepIdx) {
        PATH = pathKey; STEP = stepIdx;
        var url = '?path=' + encodeURIComponent(pathKey) + '&step=' + stepIdx;
        history.pushState({ path: pathKey, step: stepIdx }, '', url);
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function render() {
        if (!PATH || !TOURS[PATH]) renderChooser();
        else renderStep(PATH, STEP);
      }

      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, function(c){
          return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
      }

      // ── Controls ────────────────────────────────────────────────
      $('prev-btn').addEventListener('click', function(){
        if (!PATH) return;
        if (STEP > 0) go(PATH, STEP - 1);
      });
      $('next-btn').addEventListener('click', function(){
        if (!PATH) return;
        var max = TOURS[PATH].steps.length - 1;
        if (STEP < max) {
          go(PATH, STEP + 1);
        } else {
          // Finish: return to chooser, fire completion event.
          gtag('event', 'tour_complete', { path: PATH, steps: max + 1 });
          PATH = null; STEP = 0;
          history.pushState({}, '', '/ao/tour.html');
          render();
        }
      });
      $('exit-btn').addEventListener('click', function(ev){
        ev.preventDefault();
        PATH = null; STEP = 0;
        history.pushState({}, '', '/ao/tour.html');
        render();
      });
      $('share-btn').addEventListener('click', function(){
        var url = location.origin + location.pathname + location.search;
        var btn = $('share-btn');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function(){
            btn.textContent = 'copied ✓';
            btn.classList.add('copied');
            setTimeout(function(){
              btn.textContent = 'share step';
              btn.classList.remove('copied');
            }, 1800);
          });
        } else {
          // Fallback: prompt
          window.prompt('Shareable link:', url);
        }
        gtag('event', 'tour_step_share', { path: PATH, step: STEP });
      });

      // Keyboard nav
      document.addEventListener('keydown', function(ev){
        if (ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if (ev.key === 'ArrowRight' && PATH) { $('next-btn').click(); }
        else if (ev.key === 'ArrowLeft' && PATH) { $('prev-btn').click(); }
        else if (ev.key === 'Escape' && PATH) { $('exit-btn').click(); }
      });

      // Back/forward
      window.addEventListener('popstate', function(){
        var q = new URLSearchParams(location.search);
        PATH = q.get('path');
        STEP = parseInt(q.get('step'), 10) || 0;
        render();
      });

      render();
    })();
  </script>
