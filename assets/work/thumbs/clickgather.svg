<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <defs>
    <linearGradient id="cg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2326"/>
      <stop offset="55%" stop-color="#0f2a2d"/>
      <stop offset="100%" stop-color="#11353a"/>
    </linearGradient>
    <radialGradient id="cg-warm" cx="78%" cy="18%" r="55%">
      <stop offset="0%" stop-color="rgba(207,168,86,0.16)"/>
      <stop offset="60%" stop-color="rgba(207,168,86,0.04)"/>
      <stop offset="100%" stop-color="rgba(207,168,86,0)"/>
    </radialGradient>
    <pattern id="cg-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
    <linearGradient id="cg-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a40"/>
      <stop offset="100%" stop-color="#143034"/>
    </linearGradient>
    <linearGradient id="cg-feat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4046"/>
      <stop offset="100%" stop-color="#173338"/>
    </linearGradient>
    <filter id="cg-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="url(#cg-bg)"/>
  <rect width="1600" height="1000" fill="url(#cg-grid)"/>
  <rect width="1600" height="1000" fill="url(#cg-warm)"/>

  <!-- top identity row (org header) -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="1600" height="96" fill="rgba(255,255,255,0.02)"/>
    <line x1="0" y1="96" x2="1600" y2="96" stroke="rgba(207,168,86,0.18)" stroke-width="1"/>
    <!-- org avatar -->
    <circle cx="92" cy="48" r="22" fill="#cfa856"/>
    <text x="92" y="55" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0d2326" text-anchor="middle">jr</text>
    <!-- org name -->
    <text x="132" y="44" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#e9e3d4">Joseph Rock Foundation</text>
    <text x="132" y="66" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a2b4b6" letter-spacing="0.04em">josephrock.clickgather.events</text>
    <!-- nav pills -->
    <g transform="translate(1200,30)" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#a2b4b6">
      <text x="0" y="22">Events</text>
      <text x="80" y="22">About</text>
      <text x="150" y="22">Contact</text>
      <rect x="240" y="2" width="120" height="36" rx="18" fill="#cfa856"/>
      <text x="300" y="25" fill="#0d2326" font-weight="700" text-anchor="middle">RSVP</text>
    </g>
  </g>

  <!-- featured event hero -->
  <g transform="translate(80,156)" filter="url(#cg-shadow)">
    <rect x="0" y="0" width="980" height="420" rx="20" fill="url(#cg-feat)" stroke="rgba(207,168,86,0.16)" stroke-width="1"/>
    <!-- image placeholder area (left half) -->
    <rect x="20" y="20" width="380" height="380" rx="12" fill="#0a1b1e"/>
    <!-- abstract scene: mountain silhouette + sun -->
    <circle cx="320" cy="120" r="44" fill="rgba(207,168,86,0.25)"/>
    <circle cx="320" cy="120" r="28" fill="#cfa856" opacity="0.75"/>
    <path d="M 20 320 L 100 220 L 160 270 L 240 180 L 320 250 L 400 200 L 400 400 L 20 400 Z" fill="rgba(15,40,44,0.85)"/>
    <path d="M 20 360 L 90 290 L 160 320 L 230 270 L 310 310 L 400 270 L 400 400 L 20 400 Z" fill="rgba(10,27,30,0.95)"/>

    <!-- date block -->
    <g transform="translate(440,40)">
      <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#cfa856" letter-spacing="0.16em">FEATURED · SAT JUN 7</text>
    </g>
    <text x="440" y="120" font-family="Georgia, serif" font-size="40" font-weight="600" fill="#e9e3d4">Solstice Gathering</text>
    <text x="440" y="160" font-family="Georgia, serif" font-size="40" font-weight="600" fill="#e9e3d4">at Punalu'u</text>

    <text x="440" y="206" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#a2b4b6">A daylong community ceremony with music, food,</text>
    <text x="440" y="228" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#a2b4b6">and stories — open to all.</text>

    <!-- meta row -->
    <g transform="translate(440,272)" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a2b4b6">
      <circle cx="6" cy="-4" r="3" fill="#cfa856"/>
      <text x="20" y="0">Punalu'u Beach · Hawai'i Island</text>
      <circle cx="246" cy="-4" r="3" fill="#cfa856"/>
      <text x="260" y="0">9 AM – 5 PM</text>
      <circle cx="372" cy="-4" r="3" fill="#cfa856"/>
      <text x="386" y="0">Free</text>
    </g>

    <!-- CTAs -->
    <rect x="440" y="320" width="160" height="48" rx="24" fill="#cfa856"/>
    <text x="520" y="350" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0d2326" text-anchor="middle">RSVP free</text>
    <rect x="616" y="320" width="160" height="48" rx="24" fill="none" stroke="rgba(233,227,212,0.30)" stroke-width="1.5"/>
    <text x="696" y="350" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e9e3d4" text-anchor="middle">Share</text>
  </g>

  <!-- right side: upcoming list -->
  <g transform="translate(1100,156)">
    <text x="0" y="-2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#a2b4b6" letter-spacing="0.18em">UPCOMING</text>

    <!-- item 1 -->
    <g transform="translate(0,20)">
      <rect width="420" height="120" rx="14" fill="url(#cg-card)" stroke="rgba(255,255,255,0.05)"/>
      <rect x="20" y="22" width="76" height="76" rx="10" fill="#0a1b1e"/>
      <text x="58" y="52" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#cfa856" text-anchor="middle">JUN</text>
      <text x="58" y="84" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#e9e3d4" text-anchor="middle">14</text>
      <text x="116" y="50" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#e9e3d4">Earth Mixer · Hilo</text>
      <text x="116" y="76" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a2b4b6">Talks &amp; tabling · 5 PM</text>
      <text x="116" y="98" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#cfa856">$10 suggested</text>
    </g>

    <!-- item 2 -->
    <g transform="translate(0,156)">
      <rect width="420" height="120" rx="14" fill="url(#cg-card)" stroke="rgba(255,255,255,0.05)"/>
      <rect x="20" y="22" width="76" height="76" rx="10" fill="#0a1b1e"/>
      <text x="58" y="52" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#cfa856" text-anchor="middle">JUN</text>
      <text x="58" y="84" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#e9e3d4" text-anchor="middle">22</text>
      <text x="116" y="50" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#e9e3d4">Community Circle</text>
      <text x="116" y="76" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a2b4b6">Open conversation · 7 PM</text>
      <text x="116" y="98" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#cfa856">Free</text>
    </g>

    <!-- item 3 -->
    <g transform="translate(0,292)">
      <rect width="420" height="120" rx="14" fill="url(#cg-card)" stroke="rgba(255,255,255,0.05)"/>
      <rect x="20" y="22" width="76" height="76" rx="10" fill="#0a1b1e"/>
      <text x="58" y="52" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#cfa856" text-anchor="middle">JUL</text>
      <text x="58" y="84" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#e9e3d4" text-anchor="middle">04</text>
      <text x="116" y="50" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#e9e3d4">Storytelling Workshop</text>
      <text x="116" y="76" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a2b4b6">Series · 6:30 PM</text>
      <text x="116" y="98" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#cfa856">$25 / sliding</text>
    </g>
  </g>

  <!-- bottom strip: multi-tenant proof -->
  <g transform="translate(80,628)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#a2b4b6" letter-spacing="0.18em">ALSO LIVE ON THE PLATFORM</text>
    <g transform="translate(0,28)">
      <!-- tenant card 1 -->
      <rect x="0" y="0" width="460" height="290" rx="16" fill="url(#cg-card)" stroke="rgba(255,255,255,0.05)"/>
      <circle cx="44" cy="44" r="20" fill="#2d6a4f"/>
      <text x="44" y="51" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#e9e3d4" text-anchor="middle">nt</text>
      <text x="80" y="40" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#e9e3d4">New Thought Center</text>
      <text x="80" y="60" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">ntch.clickgather.events</text>
      <rect x="20" y="88" width="420" height="2" rx="1" fill="rgba(45,106,79,0.40)"/>
      <text x="20" y="124" font-family="Georgia, serif" font-size="15" fill="#e9e3d4">Sunday Service · Weekly</text>
      <text x="20" y="148" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">10 AM · Sanctuary</text>
      <text x="20" y="184" font-family="Georgia, serif" font-size="15" fill="#e9e3d4">Meditation Circle</text>
      <text x="20" y="208" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">Thursdays · 7 PM</text>
      <text x="20" y="244" font-family="Georgia, serif" font-size="15" fill="#e9e3d4">Sound Bath</text>
      <text x="20" y="268" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">First Saturday · 4 PM</text>

      <!-- tenant card 2 -->
      <g transform="translate(490,0)">
        <rect x="0" y="0" width="460" height="290" rx="16" fill="url(#cg-card)" stroke="rgba(255,255,255,0.05)"/>
        <circle cx="44" cy="44" r="20" fill="#2563eb"/>
        <text x="44" y="51" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#e9e3d4" text-anchor="middle">te</text>
        <text x="80" y="40" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#e9e3d4">Test Org Studios</text>
        <text x="80" y="60" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">testevent.clickgather.events</text>
        <rect x="20" y="88" width="420" height="2" rx="1" fill="rgba(37,99,235,0.40)"/>
        <text x="20" y="124" font-family="Georgia, serif" font-size="15" fill="#e9e3d4">Speaker Series · Q3</text>
        <text x="20" y="148" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">Tickets · From $35</text>
        <text x="20" y="184" font-family="Georgia, serif" font-size="15" fill="#e9e3d4">Member Brunch</text>
        <text x="20" y="208" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">Monthly · RSVP only</text>
        <text x="20" y="244" font-family="Georgia, serif" font-size="15" fill="#e9e3d4">Annual Gala</text>
        <text x="20" y="268" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">November · Sponsorships open</text>
      </g>

      <!-- tenant card 3 -->
      <g transform="translate(980,0)">
        <rect x="0" y="0" width="460" height="290" rx="16" fill="url(#cg-card)" stroke="rgba(255,255,255,0.05)"/>
        <circle cx="44" cy="44" r="20" fill="#cfa856"/>
        <text x="44" y="51" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#0d2326" text-anchor="middle">jr</text>
        <text x="80" y="40" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#e9e3d4">Joseph Rock Foundation</text>
        <text x="80" y="60" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">josephrock.clickgather.events</text>
        <rect x="20" y="88" width="420" height="2" rx="1" fill="rgba(207,168,86,0.40)"/>
        <text x="20" y="124" font-family="Georgia, serif" font-size="15" fill="#e9e3d4">Solstice Gathering</text>
        <text x="20" y="148" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">Jun 7 · Punalu'u Beach</text>
        <text x="20" y="184" font-family="Georgia, serif" font-size="15" fill="#e9e3d4">Earth Mixer · Hilo</text>
        <text x="20" y="208" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">Jun 14 · $10 suggested</text>
        <text x="20" y="244" font-family="Georgia, serif" font-size="15" fill="#e9e3d4">Storytelling Workshop</text>
        <text x="20" y="268" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a2b4b6">Jul 4 · Series</text>
      </g>
    </g>
  </g>

  <!-- bottom wordmark -->
  <g transform="translate(80,952)">
    <text font-family="Georgia, serif" font-size="20" font-weight="700" fill="#cfa856" letter-spacing="-0.005em">ClickGather</text>
    <text x="160" y="0" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a2b4b6">Event calendars for mission-driven organizations</text>
  </g>
</svg>
